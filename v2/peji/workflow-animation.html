<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-canvas: #1c0910;
      --bg-surface: rgba(58, 20, 33, 0.55);
      --border-muted: rgba(200, 125, 140, 0.22);
      --border-active: #f4b6c2;
      --accent-glow: #e08295;
      --cream: #fdf6f7;
      --plum-dark: #380e1c;
      --text-muted: #b58996;
      --badge-bg: rgba(92, 36, 53, 0.65);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(circle at 50% 45%, rgba(168, 66, 91, 0.16) 0%, transparent 65%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
       flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .workflow-stage {
      width: 100%;
      max-width: 940px;
      padding: 40px 24px;
      position: relative;
    }

    /* =====================================================
       STYLE 1 (DEFAULT): CONNECTED NODE PIPELINE STREAM
       ===================================================== */
    .pipeline-container {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      align-items: start;
      z-index: 2;
    }

    /* Continuous SVG Data Conduit Behind Nodes */
    .conduit-track {
      position: absolute;
      top: 40px;
      left: 12.5%;
      right: 12.5%;
      height: 4px;
      background: rgba(200, 125, 140, 0.18);
      border-radius: 999px;
      z-index: 1;
      overflow: hidden;
    }

    /* Progress fill along the line */
    .conduit-progress {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, rgba(224,130,149,0.25), #f4b6c2, #fdf6f7);
      border-radius: 999px;
      transition: width 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 14px rgba(244, 182, 194, 0.7);
    }

    /* Glowing traveling data packet */
    .data-packet {
      position: absolute;
      top: 36px;
      left: 12.5%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--cream);
      box-shadow: 0 0 12px 4px rgba(244, 182, 194, 0.85);
      transform: translate(-50%, 0);
      z-index: 2;
      transition: left 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
      pointer-events: none;
    }

    /* Individual Step Node Column */
    .flow-node {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      padding: 0 6px;
    }

    /* Circular/Squircle Icon Hub */
    .node-hub-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    /* Expanding sonar ring when active */
    .node-pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      border: 1.5px solid var(--border-active);
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
    }

    .flow-node.active .node-pulse-ring {
      animation: hubRipple 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    @keyframes hubRipple {
      0% {
        transform: scale(0.92);
        opacity: 0.75;
      }
      100% {
        transform: scale(1.38);
        opacity: 0;
      }
    }

    /* Main Icon Squircle */
    .node-hub {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: #2b0f19;
      border: 1.5px solid var(--border-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: var(--text-muted);
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.5);
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .flow-node.passed .node-hub {
      border-color: rgba(224, 130, 149, 0.55);
      color: #ebc2cc;
      background: #361320;
    }

    .flow-node.active .node-hub {
      background: var(--cream);
      border-color: var(--cream);
      color: var(--plum-dark);
      transform: translateY(-5px) scale(1.08);
      box-shadow:
        0 14px 30px -6px rgba(224, 130, 149, 0.45),
        0 0 0 4px rgba(244, 182, 194, 0.2);
    }

    /* Floating Step Number Pill on Corner of Hub */
    .node-index {
      position: absolute;
      top: -6px;
      right: -6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 999px;
      background: #3d1724;
      color: var(--text-muted);
      border: 1px solid var(--border-muted);
      transition: all 0.35s ease;
    }

    .flow-node.active .node-index {
      background: var(--plum-dark);
      color: var(--cream);
      border-color: var(--plum-dark);
      transform: scale(1.08);
    }

    .node-icon {
      width: 30px;
      height: 30px;
      stroke-width: 1.8;
    }

    /* Typography & Pill under Node */
    .node-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: #c9a3ae;
      margin: 0 0 10px 0;
      line-height: 1.3;
      transition: color 0.35s ease, transform 0.35s ease;
    }

    .flow-node.active .node-title {
      color: var(--cream);
      transform: translateY(-2px);
    }

    .node-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.73rem;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(74, 27, 42, 0.55);
      color: #b58996;
      border: 1px solid rgba(200, 125, 140, 0.16);
      transition: all 0.35s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Live indicator dot inside badge */
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8f5c6c;
      transition: all 0.35s ease;
    }

    .flow-node.active .node-badge {
      background: rgba(244, 182, 194, 0.16);
      color: var(--cream);
      border-color: rgba(244, 182, 194, 0.55);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .flow-node.active .badge-dot {
      background: #f4b6c2;
      box-shadow: 0 0 8px #f4b6c2;
    }

    /* =====================================================
       STYLE 2: FLOATING GLASS CAPSULE STREAM
       ===================================================== */
    body[data-style="capsules"] .conduit-track,
    body[data-style="capsules"] .data-packet {
      display: none;
    }

    body[data-style="capsules"] .pipeline-container {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 12px;
    }

    body[data-style="capsules"] .flow-node {
      flex: 1;
      flex-direction: row;
      text-align: left;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(45, 15, 26, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(200, 125, 140, 0.2);
      gap: 14px;
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body[data-style="capsules"] .flow-node.active {
      flex: 1.35;
      background: linear-gradient(135deg, rgba(253, 246, 247, 0.97), rgba(245, 223, 228, 0.95));
      border-color: var(--cream);
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.55), 0 0 24px rgba(224, 130, 149, 0.35);
      transform: translateY(-4px);
    }

    body[data-style="capsules"] .node-hub-wrap {
      width: 52px;
      height: 52px;
      margin-bottom: 0;
      flex-shrink: 0;
    }

    body[data-style="capsules"] .node-hub {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      transform: none !important;
      box-shadow: none;
    }

    body[data-style="capsules"] .flow-node.active .node-hub {
      background: var(--plum-dark);
      color: var(--cream);
      border-color: var(--plum-dark);
    }

    body[data-style="capsules"] .node-pulse-ring {
      display: none;
    }

    body[data-style="capsules"] .flow-node.active .node-title {
      color: var(--plum-dark);
      transform: none;
    }

    body[data-style="capsules"] .flow-node.active .node-badge {
      background: rgba(56, 14, 28, 0.1);
      color: var(--plum-dark);
      border-color: rgba(56, 14, 28, 0.2);
      box-shadow: none;
    }

    body[data-style="capsules"] .flow-node.active .badge-dot {
      background: var(--plum-dark);
      box-shadow: none;
    }

    /* =====================================================
       STYLE 3: ORBITAL HEX / RADIAL PULSE DECK
       ===================================================== */
    body[data-style="minimal"] .conduit-track {
      top: auto;
      bottom: -18px;
      left: 0;
      right: 0;
      height: 2px;
    }

    body[data-style="minimal"] .data-packet {
      display: none;
    }

    body[data-style="minimal"] .flow-node {
      padding: 22px 16px;
      border-radius: 16px;
      background: transparent;
      border: 1px solid transparent;
      transition: all 0.4s ease;
    }

    body[data-style="minimal"] .flow-node.active {
      background: rgba(244, 182, 194, 0.07);
      border-color: rgba(244, 182, 194, 0.28);
    }

    body[data-style="minimal"] .node-hub {
      border-radius: 50%;
    }

    body[data-style="minimal"] .node-pulse-ring {
      border-radius: 50%;
    }

    /* =====================================================
       SVG ICON ANIMATIONS WHEN ACTIVE
       ===================================================== */
    .flow-node.active .anim-arrow {
      animation: bounceDown 1s ease-in-out infinite;
    }
    @keyframes bounceDown {
      0%, 100% { transform: translateY(-1.5px); }
      50% { transform: translateY(2.5px); }
    }

    .flow-node.active .anim-check {
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      animation: drawCheck 0.55s ease-out forwards;
    }
    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    .flow-node.active .anim-bar-1 {
      transform-origin: bottom;
      animation: pulseBar 1s ease-in-out infinite;
    }
    .flow-node.active .anim-bar-2 {
      transform-origin: bottom;
      animation: pulseBar 1s ease-in-out 0.15s infinite;
    }
    .flow-node.active .anim-bar-3 {
      transform-origin: bottom;
      animation: pulseBar 1s ease-in-out 0.3s infinite;
    }
    @keyframes pulseBar {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.6); }
    }

    .flow-node.active .anim-wave-1 {
      animation: waveFade 1.1s ease-out infinite;
    }
    .flow-node.active .anim-wave-2 {
      animation: waveFade 1.1s ease-out 0.25s infinite;
    }
    @keyframes waveFade {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }

    /* Unobtrusive corner style selector (auto-hides opacity until hovered) */
    .style-switcher {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(38, 12, 22, 0.85);
      border: 1px solid rgba(200, 125, 140, 0.25);
      opacity: 0.35;
      transition: opacity 0.25s ease;
      z-index: 50;
    }
    .style-switcher:hover {
      opacity: 1;
    }
    .style-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #b58996;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .style-btn.active {
      background: var(--cream);
      color: var(--plum-dark);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .pipeline-container,
      body[data-style="capsules"] .pipeline-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px 14px;
      }
      .conduit-track,
      .data-packet {
        display: none;
      }
    }

    @media (max-width: 460px) {
      .pipeline-container,
      body[data-style="capsules"] .pipeline-container {
        grid-template-columns: 1fr;
      }
      .flow-node {
        flex-direction: row;
        text-align: left;
        gap: 16px;
        background: rgba(45, 15, 26, 0.45);
        padding: 14px;
        border-radius: 16px;
        border: 1px solid rgba(200, 125, 140, 0.16);
      }
      .node-hub-wrap {
        margin-bottom: 0;
        width: 60px;
        height: 60px;
      }
      .node-hub {
        width: 60px;
        height: 60px;
      }
    }

    /* Embedded mode (?embed=1): compact horizontal pipeline at any width */
    body.is-embedded { padding: 0; }
    body.is-embedded .workflow-stage { max-width: none; padding: 26px 18px; }
    body.is-embedded .pipeline-container { grid-template-columns: repeat(4, 1fr); gap: 10px; }
    body.is-embedded .conduit-track,
    body.is-embedded .data-packet { display: block; }
    body.is-embedded .conduit-track { top: 56px; left: calc(12.5% + 19px); right: calc(12.5% + 19px); }
    body.is-embedded .data-packet { top: 52px; left: calc(12.5% + 19px); }
    body.is-embedded .node-hub-wrap { width: 64px; height: 64px; margin-bottom: 12px; }
    body.is-embedded .node-hub { width: 56px; height: 56px; border-radius: 18px; }
    body.is-embedded .node-icon { width: 26px; height: 26px; }
    body.is-embedded .flow-node { flex-direction: column; text-align: center; background: none; border: none; padding: 0 4px; gap: 0; }
    body.is-embedded .node-title { font-size: 0.8rem; margin-bottom: 8px; }
    body.is-embedded .node-badge { font-size: 0.65rem; padding: 4px 8px; max-width: 100%; flex-wrap: wrap; justify-content: center; }
    @media (max-width: 420px) {
      body.is-embedded .workflow-stage { padding: 20px 12px; }
      body.is-embedded .pipeline-container { gap: 8px; }
      body.is-embedded .conduit-track { top: 46px; left: calc(12.5% + 13px); right: calc(12.5% + 13px); }
      body.is-embedded .data-packet { top: 42px; left: calc(12.5% + 13px); }
      body.is-embedded .node-hub-wrap { width: 56px; height: 56px; margin-bottom: 10px; }
      body.is-embedded .node-hub { width: 48px; height: 48px; border-radius: 15px; }
      body.is-embedded .node-icon { width: 22px; height: 22px; }
      body.is-embedded .flow-node { padding: 0 2px; }
      body.is-embedded .node-title { font-size: 0.7rem; margin-bottom: 6px; }
      body.is-embedded .node-badge { font-size: 0.6rem; padding: 3px 6px; }
    }
    body.is-embedded .style-switcher { display: none; }
  </style>
</head>
<body data-style="pipeline">
  <script>if(new URLSearchParams(location.search).has("embed"))document.body.classList.add("is-embedded")</script>

  <div class="workflow-stage" id="workflowStage">
    <!-- Animated Conduit Line & Traveling Packet -->
    <div class="conduit-track" aria-hidden="true">
      <div class="conduit-progress" id="conduitProgress"></div>
    </div>
    <div class="data-packet" id="dataPacket" aria-hidden="true"></div>

    <!-- 4-Step Node Flow -->
    <div class="pipeline-container" role="list">

      <!-- STEP 01 -->
      <div class="flow-node passed" data-step="0" role="listitem" tabindex="0">
        <div class="node-hub-wrap">
          <div class="node-pulse-ring"></div>
          <div class="node-hub">
            <span class="node-index">01</span>
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.5 19H18a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7.7 9.6 4.5 4.5 0 0 0 6.5 18.5h1" />
              <g class="anim-arrow">
                <path d="M12 11v8" />
                <path d="m9 16 3 3 3-3" />
              </g>
            </svg>
          </div>
        </div>
        <div>
          <h3 class="node-title">Pull Daily Data</h3>
          <span class="node-badge"><span class="badge-dot"></span>API fetch</span>
        </div>
      </div>

      <!-- STEP 02 -->
      <div class="flow-node active" data-step="1" role="listitem" tabindex="0">
        <div class="node-hub-wrap">
          <div class="node-pulse-ring"></div>
          <div class="node-hub">
            <span class="node-index">02</span>
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="6" cy="6" r="2.5" />
              <circle cx="6" cy="18" r="2.5" />
              <path d="M6 8.5v7" />
              <path d="M13 6h3a2 2 0 0 1 2 2v2.5" />
              <path class="anim-check" d="m14.5 16.5 2.2 2.2 4.3-4.4" />
            </svg>
          </div>
        </div>
        <div>
          <h3 class="node-title">Validate Changes</h3>
          <span class="node-badge"><span class="badge-dot"></span>Diff checked</span>
        </div>
      </div>

      <!-- STEP 03 -->
      <div class="flow-node" data-step="2" role="listitem" tabindex="0">
        <div class="node-hub-wrap">
          <div class="node-pulse-ring"></div>
          <div class="node-hub">
            <span class="node-index">03</span>
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <line class="anim-bar-1" x1="8" y1="16" x2="8" y2="11" />
              <line class="anim-bar-2" x1="12" y1="16" x2="12" y2="8" />
              <line class="anim-bar-3" x1="16" y1="16" x2="16" y2="10" />
            </svg>
          </div>
        </div>
        <div>
          <h3 class="node-title">Reports &amp; Dashboard</h3>
          <span class="node-badge"><span class="badge-dot"></span>Refreshed</span>
        </div>
      </div>

      <!-- STEP 04 -->
      <div class="flow-node" data-step="3" role="listitem" tabindex="0">
        <div class="node-hub-wrap">
          <div class="node-pulse-ring"></div>
          <div class="node-hub">
            <span class="node-index">04</span>
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="3" width="11" height="18" rx="2.5" />
              <line x1="9.5" y1="17.5" x2="11.5" y2="17.5" />
              <path class="anim-wave-1" d="M18.5 8.5a3.5 3.5 0 0 1 0 5" />
              <path class="anim-wave-2" d="M21 6a7 7 0 0 1 0 10" />
            </svg>
          </div>
        </div>
        <div>
          <h3 class="node-title">Serve to Apps</h3>
          <span class="node-badge"><span class="badge-dot"></span>PA app ready</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Minimal icon-only layout switcher in bottom-right corner -->
  <div class="style-switcher" aria-label="Switch visual layout">
    <button class="style-btn active" data-layout="pipeline" title="Node Pipeline">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="3"/><circle cx="19" cy="12" r="3"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    </button>
    <button class="style-btn" data-layout="capsules" title="Expanding Glass Capsules">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="6"/></svg>
    </button>
    <button class="style-btn" data-layout="minimal" title="Orbital Pulse">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <script>
    (function () {
      const STEP_DURATION = 2200;
      const nodes = Array.from(document.querySelectorAll('.flow-node'));
      const conduitProgress = document.getElementById('conduitProgress');
      const dataPacket = document.getElementById('dataPacket');
      const styleButtons = Array.from(document.querySelectorAll('.style-btn'));

      let currentIndex = 0;
      let timerId = null;
      let isPaused = false;

      // Embedded mode (?embed=1): align conduit + packet to actual hub centers at any width
      const isEmbedded = document.body.classList.contains('is-embedded');
      const stageEl = document.getElementById('workflowStage');
      const trackEl = document.querySelector('.conduit-track');

      function hubCenterPct(idx) {
        if (!isEmbedded) return packetPositions[idx];
        const s = stageEl.getBoundingClientRect();
        const h = nodes[idx].querySelector('.node-hub-wrap').getBoundingClientRect();
        return ((h.left + h.width / 2 - s.left) / s.width) * 100;
      }

      function alignConduit() {
        if (!isEmbedded || !trackEl) return;
        trackEl.style.left = hubCenterPct(0) + '%';
        trackEl.style.right = (100 - hubCenterPct(nodes.length - 1)) + '%';
      }

      // Positions along the horizontal conduit (0%, 33.33%, 66.66%, 100%)
      const trackPercentages = [0, 33.333, 66.666, 100];
      // Matching left percentage across the full stage (12.5% to 87.5%)
      const packetPositions = [12.5, 37.5, 62.5, 87.5];

      function updateStep(index) {
        currentIndex = index;

        nodes.forEach((node, idx) => {
          node.classList.remove('active', 'passed');
          if (idx < currentIndex) {
            node.classList.add('passed');
          } else if (idx === currentIndex) {
            void node.offsetWidth;
            node.classList.add('active');
          }
        });

        // Animate conduit fill and glowing data packet
        if (conduitProgress) {
          conduitProgress.style.width = `${trackPercentages[currentIndex]}%`;
        }
        if (dataPacket) {
          dataPacket.style.left = `${hubCenterPct(currentIndex)}%`;
        }
      }

      function startCycle() {
        stopCycle();
        timerId = setInterval(() => {
          if (!isPaused) {
            const next = (currentIndex + 1) % nodes.length;
            updateStep(next);
          }
        }, STEP_DURATION);
      }

      function stopCycle() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      nodes.forEach((node, idx) => {
        node.addEventListener('mouseenter', () => {
          isPaused = true;
          updateStep(idx);
        });
        node.addEventListener('mouseleave', () => {
          isPaused = false;
          startCycle();
        });
        node.addEventListener('click', () => {
          isPaused = true;
          updateStep(idx);
        });
      });

      // Layout preset switcher
      styleButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const layout = btn.getAttribute('data-layout');
          document.body.setAttribute('data-style', layout);
          styleButtons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      if (isEmbedded) {
        window.addEventListener('resize', alignConduit);
      }

      window.addEventListener('load', () => {
        updateStep(1);
        alignConduit();
        startCycle();
      });
    })();
  </script>
</body>
</html>
